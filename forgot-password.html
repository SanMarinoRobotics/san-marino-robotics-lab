    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef2f7; --border:#dde3ea;

    --accent-soft:#fdeceb; --steel:#1a63e0; --success:#1f9d55; --success-soft:#e4f7ea;
    --danger:#c81810; --danger-soft:#fdeceb;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:"IBM Plex Sans",sans-serif; padding:20px;
    position:relative; overflow-x:hidden;
  }
  .bg-watermark{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .bg-watermark svg{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:1200px; max-width:160%; color:var(--text); opacity:.06;}
  .bg-watermark-top{position:fixed; inset:0 0 auto 0; height:220px; z-index:0; overflow:hidden; pointer-events:none;}
  .bg-watermark-top svg{position:absolute; top:0; left:50%; transform:translateX(-50%); width:1200px; max-width:160%; color:var(--text); opacity:.06;}
  .card{
    position:relative; z-index:1;
    background:var(--surface); border:1px solid var(--border); border-top:4px solid var(--steel);
    max-width:400px; width:100%; padding:32px 28px;
    box-shadow:0 30px 60px -30px rgba(20,20,20,.15);
  }
  .mark{
    width:44px; height:44px; background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--accent-2);
    font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:16px; margin-bottom:16px;
  }
  h1{font-family:"Big Shoulders Display",sans-serif; font-weight:800; text-transform:uppercase; font-size:22px; margin:0;}
  p.sub{color:var(--text-dim); font-size:14px; margin:6px 0 24px; line-height:1.5;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  input{
    width:100%; padding:12px 14px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:14.5px; font-family:inherit; margin-bottom:16px;
  }
  input:focus{outline:2px solid var(--steel); outline-offset:1px;}
  button{
    width:100%; padding:14px; background:var(--steel); color:#fff; border:none;
    font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
  }
  button:hover{background:#154fb8;}
  button:disabled{opacity:.6; cursor:default;}
  .error{background:var(--danger-soft); color:var(--danger); font-size:13.5px; padding:10px 12px; margin-bottom:16px; display:none;}
  .success{background:var(--success-soft); color:var(--success); font-size:14px; padding:16px; text-align:center; display:none; line-height:1.6;}
  .foot{margin-top:20px; font-size:13.5px; color:var(--text-dim); text-align:center;}
  a{color:var(--steel); font-weight:600; text-decoration:none;}
  #formArea.hidden{display:none;}
</style>

  <div class="card">
    <div class="mark">SM</div>
    <h1>Reset Password</h1>
    <p class="sub">Enter your account email and a new password. The club admin will review and approve the change before it takes effect.</p>

    <div class="success" id="successBox">
      ✅ Request submitted. Once the admin approves it, you'll be able to log in with your new password.
    </div>

    <div id="formArea">
      <div class="error" id="err"></div>
      <form id="resetForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
        <label for="newPassword2">Confirm New Password</label>
        <input type="password" id="newPassword2" required minlength="8" autocomplete="new-password">
        <button type="submit" id="submitBtn">Submit Request</button>
      </form>
    </div>

    <div class="foot"><a href="/login.html">Back to Sign In</a></div>
  </div>

  <script>
    var form = document.getElementById('resetForm');
    var errBox = document.getElementById('err');
    var btn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      errBox.style.display = 'none';

      var p1 = document.getElementById('newPassword').value;
      var p2 = document.getElementById('newPassword2').value;
      if (p1 !== p2) {
        errBox.textContent = 'Passwords do not match.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';

      fetch('/api/request-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          newPassword: p1
        })
      })
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        if (res.ok) {
          document.getElementById('formArea').classList.add('hidden');
          document.getElementById('successBox').style.display = 'block';
        } else {
          errBox.textContent = res.data.error || 'Something went wrong.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Submit Request';
        }
      })
      .catch(function(){
        errBox.textContent = 'Network error. Please try again.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Request';
      });
    });
  </script>
